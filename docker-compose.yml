services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextgen-app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: nextgen
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    networks:
      - nextgen-network

  db:
    image: mysql:8.0
    container_name: nextgen-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nextgen
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/nextgen.sql:/docker-entrypoint-initdb.d/nextgen.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - nextgen-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: nextgen-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - nextgen-network

volumes:
  db_data:

networks:
  nextgen-network:
    driver: bridge
